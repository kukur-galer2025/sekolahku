; Queue worker MyPresence (/etc/supervisor/conf.d/mypresence-worker.conf)
; Menjalankan impor Excel, ekspor data, email. deploy.sh memanggil `php artisan queue:restart` tiap rilis.
[program:mypresence-worker]
process_name=%(program_name)s_%(process_num)02d
command=php __APP_DIR__/current/artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600 --memory=256
directory=__APP_DIR__/current
user=__APP_USER__
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=__APP_DIR__/shared/storage/logs/worker.log
