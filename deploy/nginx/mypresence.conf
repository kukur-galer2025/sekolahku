# MyPresence — Nginx untuk domain pusat + wildcard subdomain sekolah
# Salin ke /etc/nginx/sites-available/mypresence lalu:
#   ln -s /etc/nginx/sites-available/mypresence /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# provision.sh memasangnya otomatis (mengganti domain & folder). Root = current/public (rilis atomik deploy.sh).

# 1) Host tak dikenal (akses lewat IP langsung, domain asing) → putus koneksi.
#    Mencegah serangan Host header dan bot pemindai.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# 2) HTTP → HTTPS untuk domain pusat dan semua sekolah.
server {
    listen 80;
    listen [::]:80;
    server_name mypresence.id *.mypresence.id;
    return 301 https://$host$request_uri;
}

# 3) Aplikasi. Satu blok melayani mypresence.id, www, dan {sekolah}.mypresence.id;
#    Laravel (Route::domain + IdentifyTenant) yang memilah sekolahnya.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mypresence.id *.mypresence.id;

    root /var/www/mypresence/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 16m;

    # Sertifikat WILDCARD (*.mypresence.id + mypresence.id) dari Let's Encrypt via DNS-01.
    # Langkahnya: deploy/scripts/ssl-wildcard.sh (lihat deploy/DNS.md bagian "SSL wildcard").
    ssl_certificate     /etc/letsencrypt/live/mypresence.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypresence.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Kamera dibutuhkan PWA untuk scan QR.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # Aset PWA & font: nama berversi (?v=hash) → boleh di-cache lama oleh browser.
    location ~* ^/(pwa|fonts|css|img)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
    # Service worker harus selalu dicek ulang agar versi baru PWA cepat sampai ke HP siswa.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # REMOTE_ADDR = IP asli klien (penting untuk cek WiFi sekolah). Jangan menimpa
        # dengan X-Forwarded-For di sini; bila memakai Cloudflare, atur TRUSTED_PROXIES di .env.
    }

    location ~ /\.(?!well-known).* { deny all; }
}
