; PHP-FPM pool MyPresence (/etc/php/8.3/fpm/pool.d/mypresence.conf)
[mypresence]
user = __APP_USER__
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 2 GB RAM: ~40 MB per worker → 20 worker. Naikkan pm.max_children bila RAM ditambah.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 120s
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.3-fpm-mypresence.log
php_admin_flag[log_errors] = on
